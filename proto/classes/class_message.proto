syntax = "proto3";
package classes;

option go_package = "lms-class-service/pb/classes;classes";

import "generic/generic_message.proto";

message Class {
    string id = 1;
    string university_id = 2;
    string university_name = 3;
    string faculty_id = 4;
    string faculty_name = 5;
    string programme_id = 6;
    string programme_name = 7;
    string code = 8;
    string name = 9;
    string updated_by = 10;
    string updated_at = 11;
    string created_at = 12;
}

message ClassList {
    repeated Class classes = 1;
    uint32 count = 2;
}

message ClassListInput {
    lms_class_services.Pagination pagination = 1;
}

message ClassInput {
    string university_id = 1;
    string university_name = 2;
    string faculty_id = 3;
    string faculty_name = 4;
    string programme_id = 5;
    string programme_name = 6;
    string code = 7;
    string name = 8;
}

message SubjectClass {
    string id = 1;
    string subject_id = 2;
    string class_id = 3;
    string period = 4;
    string teacher_id = 5;
    string teacher_name = 6;
    string name = 7;
    int32 timetable_day = 8;
    string timetable_time = 9;
    string updated_by = 10;
    string updated_at = 11;
    string created_at = 12;
}

message SubjectClassList {
    repeated SubjectClass subject_classes = 1;
    uint32 count = 2;
}

message SubjectClassListInput {
    lms_class_services.Pagination pagination = 1;
    string class_id = 2;
}

message SubjectClassInput {
    string subject_id = 1;
    string class_id = 2;
    string period = 3;
    string teacher_id = 4;
    string teacher_name = 5;
    string name = 6;
    int32 timetable_day = 7;
    string timetable_time = 8;
}

message StudentClass {
    string id = 1;
    string subject_class_id = 2;
    string student_id = 3;
    string student_name = 4;
    string updated_by = 5;
    string updated_at = 6;
    string created_at = 7;
}

message StudentClassList {
    repeated StudentClass student_classes = 1;
    uint32 count = 2;
}

message StudentClassListInput {
    lms_class_services.Pagination pagination = 1;
    string subject_class_id = 2;
}

message StudentClassInput {
    string subject_class_id = 1;
    string student_id = 2;
    string student_name = 3;
}

service ClassService {
    rpc List(ClassListInput) returns (ClassList);
    rpc Get(lms_class_services.Id) returns (Class);
    rpc Create(ClassInput) returns (Class);
    rpc Update(Class) returns (Class);
    rpc Delete(lms_class_services.Id) returns (lms_class_services.BoolMessage);
}

service SubjectClassService {
    rpc List(SubjectClassListInput) returns (SubjectClassList);
    rpc Get(lms_class_services.Id) returns (SubjectClass);
    rpc Create(SubjectClassInput) returns (SubjectClass);
    rpc Update(SubjectClass) returns (SubjectClass);
    rpc Delete(lms_class_services.Id) returns (lms_class_services.BoolMessage);
}

service StudentClassService {
    rpc List(StudentClassListInput) returns (StudentClassList);
    rpc Get(lms_class_services.Id) returns (StudentClass);
    rpc Create(StudentClassInput) returns (StudentClass);
    rpc Delete(lms_class_services.Id) returns (lms_class_services.BoolMessage);
}
